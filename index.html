<script>
// 1. ENLACE CORRECTO FORZADO A CSV EN LUGAR DE LA INTERFAZ DE EDICIÓN
const URL_GOOGLE_SHEETS = "https://docs.google.com/spreadsheets/d/1Iffh-VbZUFFYpI5sVI8HQAz6IPgACs_W2sq0iEH4iVo/export?format=csv";

function inicializarControlInventario() {
    console.log("=== INICIANDO CONTROL DE INVENTARIO TRACCO ===");
    
    fetch(URL_GOOGLE_SHEETS)
    .then(response => response.text())
    .then(csvText => {
        let filas = csvText.split("\n");
        let mapeo_lotes = {};
        
        // Procesamos el CSV de Google Sheets
        filas.forEach(fila => {
            let columnas = fila.split(",");
            if(columnas.length >= 2) {
                let nombreExcel = columnas[0].trim().toLowerCase().replace(/[\s_-]/g, "");
                let estadoExcel = columnas[1].trim().toLowerCase();
                if (nombreExcel) {
                    mapeo_lotes[nombreExcel] = estadoExcel;
                }
            }
        });
        console.log("Lotes cargados desde Excel:", mapeo_lotes);

        // ========================================================
        // INTERCEPTOR DE MEMORIA VIVA DE 3DVISTA
        // ========================================================
        let intentos = 0;
        let verificadorVivo = setInterval(() => {
            intentos++;
            
            // Buscamos el reproductor activo en la ventana
            if (window.pano && typeof window.pano.getPanoramas === "function") {
                let panos = window.pano.getPanoramas();
                if (panos && panos.length > 0) {
                    let seModificoAlgo = false;

                    panos.forEach(p => {
                        let hotspots = typeof p.getHotspots === "function" ? p.getHotspots() : (p.hotspots || []);
                        if (hotspots && hotspots.length > 0) {
                            hotspots.forEach(hotspot => {
                                // Obtenemos el nombre asignado en el editor de 3DVista
                                let nombre = hotspot.name || (hotspot.get ? hotspot.get("name") : "") || hotspot.id || "";
                                let nombreLimpio = nombre.toString().toLowerCase().replace(/[\s_-]/g, "");
                                
                                if (mapeo_lotes[nombreLimpio]) {
                                    let estado = mapeo_lotes[nombreLimpio];
                                    
                                    // Asignación de colores según estado del Excel
                                    let color = "#00FF00"; // Verde por defecto (Disponible)
                                    if (estado.includes("vend") || estado.includes("roj")) {
                                        color = "#FF0000"; // Rojo (Vendido)
                                    } else if (estado.includes("verd")) {
                                        color = "#00FF00"; // Verde explícito
                                    }
                                    
                                    // Forzamos el color en el motor gráfico de 3DVista
                                    hotspot.fillColor = color;
                                    hotspot.lineColor = color;
                                    hotspot.fillOpacity = 0.5;
                                    if (hotspot.set) {
                                        hotspot.set("fillColor", color);
                                        hotspot.set("lineColor", color);
                                    }
                                    seModificoAlgo = true;
                                }
                            });
                        }
                    });

                    // Si logramos alterar los colores del Canvas, refrescamos la escena actual
                    if (seModificoAlgo) {
                        console.log("¡Éxito! Colores de lotes actualizados dinámicamente.");
                        if (typeof window.pano.getCurrentPanoramaName === "function" && typeof window.pano.setPanorama === "function") {
                            let escenaActual = window.pano.getCurrentPanoramaName();
                            window.pano.setPanorama(escenaActual);
                        }
                        clearInterval(verificadorVivo); // Detenemos el ciclo de búsqueda
                    }
                }
            }

            // Si pasa mucho tiempo y el tour no carga, detenemos el script para no gastar memoria
            if (intentos > 40) {
                console.log("Búsqueda finalizada. No se detectó un reproductor activo compatible.");
                clearInterval(verificadorVivo);
            }
        }, 400);

    })
    .catch(error => console.error('Error de conexión con Sheets:', error));
}

// Inicialización segura del script
if (document.readyState === "complete" || document.readyState === "interactive") {
    inicializarControlInventario();
} else {
    window.addEventListener("DOMContentLoaded", inicializarControlInventario);
}
</script>

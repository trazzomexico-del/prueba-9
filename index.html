<script>
console.log("%c=== INICIANDO ESPIONAJE TÉCNICO TRACCO ===", "color: #00ff00; font-weight: bold; font-size: 14px;");

const URL_GOOGLE_SHEETS = "https://docs.google.com/spreadsheets/d/1Iffh-VbZUFFYpI5sVI8HQAz6IPgACs_W2sq0iEH4iVo/export?format=csv";

// 1. Verificar el enlace de Excel
fetch(URL_GOOGLE_SHEETS)
.then(r => r.text())
.then(data => {
    console.log("🟢 1. EXCEL CONECTADO. Filas detectadas:", data.split("\n").length);
})
.catch(e => console.error("🔴 ERROR CONEXIÓN EXCEL:", e));

// 2. Monitorear las entrañas de 3DVista
let checadorSistemas = setInterval(() => {
    if (window.tdvData) {
        console.log("🟢 2. DETECTADO window.tdvData");
        if (window.tdvData.panoramas && window.tdvData.panoramas[0]) {
            let primerPano = window.tdvData.panoramas[0];
            if (primerPano.hotspots) {
                console.log("🔥 ¡Hotspots encontrados en la base de datos! Cantidad:", primerPano.hotspots.length);
                console.log("📐 Estructura interna de tu Hotspot:", JSON.stringify(primerPano.hotspots[0]));
            } else {
                console.log("⚠️ El panorama no reporta hotspots internos.");
            }
        }
    }

    if (window.pano) {
        console.log("🟢 3. DETECTADO window.pano (Visor en vivo activo)");
        clearInterval(checadorSistemas); // Detener el ciclo si el visor ya arrancó
    }
}, 1500);

// Apagar el rastreador tras 15 segundos para proteger la memoria
setTimeout(() => clearInterval(checadorSistemas), 15000);
</script>

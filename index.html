<script>
console.log("%c=== PROBANDO API OFICIAL DE RENDERIZADO ===", "color: #ffff00; font-weight: bold; font-size: 14px;");

const URL_GOOGLE_SHEETS = "https://docs.google.com/spreadsheets/d/1Iffh-VbZUFFYpI5sVI8HQAz6IPgACs_W2sq0iEH4iVo/export?format=csv";

// Esperamos 6 segundos a que el mapa esté completamente activo en pantalla
setTimeout(() => {
    console.log("🚀 Verificando herramientas de control de 3DVista...");

    // 1. Verificar si el visor expone sus componentes de control
    if (window.pano) {
        console.log("🟢 Visor global 'window.pano' detectado.");
        
        // Vamos a listar todas las funciones que tiene el visor para ver cuál nos sirve para actualizar elementos
        let metodosDisponibles = Object.getOwnPropertyNames(window.pano).filter(item => typeof window.pano[item] === 'function');
        console.log("📋 Funciones disponibles en tu reproductor para alterar el mapa:", metodosDisponibles);

        // Intentar buscar un hotspot directamente mediante la API común
        if (typeof window.pano.getHotspot === "function") {
            let hotspotPrueba = window.pano.getHotspot("lote_01");
            console.log("🎯 Resultado de buscar 'lote_01' vía API:", hotspotPrueba);
        } else if (typeof window.pano.getItem === "function") {
            console.log("🎯 Cambiando estrategia a getItem...");
            let itemPrueba = window.pano.getItem("lote_01");
            console.log("📦 Objeto obtenido con getItem:", itemPrueba);
        } else {
            console.log("⚠️ El reproductor no expone funciones directas tradicionales (getHotspot/getItem).");
        }
    } else {
        console.log("🔴 No se detectó 'window.pano'. El visor podría estar encapsulado en otra variable.");
    }

    // 2. Verificar el estado actual del Excel para asegurar que no haya bloqueos de red
    fetch(URL_GOOGLE_SHEETS)
    .then(r => r.text())
    .then(data => console.log("🟢 Lectura de Sheets lista. Filas:", data.split("\n").length))
    .catch(e => console.error("🔴 Error al leer Sheets:", e));

}, 6000);
</script>

<script>
console.log("%c=== INTERCEPTOR ESTRUCTURAL INMERSIA 360 ACTIVADO ===", "color: #00ffcc; font-weight: bold; font-size: 14px;");

const URL_GOOGLE_SHEETS = "https://docs.google.com/spreadsheets/d/1Iffh-VbZUFFYpI5sVI8HQAz6IPgACs_W2sq0iEH4iVo/export?format=csv";

// Convierte texto del Excel a formato Hexadecimal legible por el Canvas
function traducirColorExcel(estadoOhex) {
    let valor = estadoOhex.trim().toLowerCase().replace("#", "");
    
    // Si ya pusiste un código HEX de 6 caracteres válido en el Sheets
    if (valor.length === 6 && /^[0-9a-f]{6}$/i.test(valor)) {
        return "#" + valor;
    }
    
    // Filtro inteligente por palabras comunes
    if (valor.includes("vend") || valor.includes("roj")) return "#FF0000"; // Rojo
    if (valor.includes("disp") || valor.includes("verd")) return "#00FF00"; // Verde
    if (valor.includes("azul")) return "#0000FF"; // Azul
    if (valor.includes("morad")) return "#800080"; // Morado
    
    return "#00FF00"; // Por defecto disponible
}

// SECUESTRO LEGÍTIMO DEL CONSTRUCTOR DE CORES DE 3DVISTA
// Interceptamos la creación del objeto "Tour" justo antes de que dibuje el Canvas
const originalTourConstructor = TDV.Tour;

TDV.Tour = function(settings, devicesUrl) {
    console.log("🎯 Capturando ajustes nativos del Tour antes de renderizar...");
    
    // Almacenamos temporalmente la instancia para usarla de forma normal
    const self = this;
    
    // Descargamos los datos en tiempo real de tu Google Sheets de forma síncrona/prioritaria
    fetch(URL_GOOGLE_SHEETS)
    .then(response => response.text())
    .then(csvText => {
        let filas = csvText.split("\n");
        let mapeo_lotes = {};
        
        filas.forEach(fila => {
            let columnas = fila.split(",");
            if(columnas.length >= 2) {
                let idLote = columnas[0].trim().toLowerCase().replace(/[\s_-]/g, "");
                let colorEstado = columnas[1].trim();
                if (idLote) mapeo_lotes[idLote] = traducirColorExcel(colorEstado);
            }
        });
        
        console.log("📊 Datos de disponibilidad procesados:", mapeo_lotes);

        // Buscamos dentro de la gigantesca estructura de datos cargada en settings (data)
        try {
            if (settings && typeof settings.get === "function") {
                let dataTour = settings.get("data") || {};
                
                // Inspeccionamos los overlays/hotspots que 3DVista tiene precargados en memoria de diseño
                if (dataTour.media && Array.isArray(dataTour.media)) {
                    dataTour.media.forEach(panorama => {
                        if (panorama.overlays && Array.isArray(panorama.overlays)) {
                            panorama.overlays.forEach(overlay => {
                                // Buscamos si el hotspot tiene una etiqueta o ID que coincida con el Excel
                                if (overlay.name) {
                                    let idHotspot = overlay.name.toLowerCase().replace(/[\s_-]/g, "");
                                    
                                    if (mapeo_lotes[idHotspot]) {
                                        let colorFinal = mapeo_lotes[idHotspot];
                                        console.log(`🎨 Lote detectado en memoria: ${overlay.name} -> Aplicando color: ${colorFinal}`);
                                        
                                        // Modificamos las propiedades nativas de color antes de que WebGL dibuje las capas
                                        if (overlay.fillColor) overlay.fillColor = colorFinal;
                                        if (overlay.lineColor) overlay.lineColor = colorFinal;
                                        if (overlay.color) overlay.color = colorFinal;
                                        
                                        // Compatibilidad con estados expandidos v2024
                                        if (overlay.states && Array.isArray(overlay.states)) {
                                            overlay.states.forEach(state => {
                                                if (state.fillColor) state.fillColor = colorFinal;
                                                if (state.lineColor) state.lineColor = colorFinal;
                                            });
                                        }
                                    }
                                }
                            });
                        }
                    });
                }
            }
        } catch (e) {
            console.error("⚠️ Error inyectando colores en la estructura interna:", e);
        }

        // Una vez alterados los colores originales por los del Excel, ejecutamos el motor original de 3DVista
        originalTourConstructor.call(self, settings, devicesUrl);
    })
    .catch(err => {
        console.error("🔴 Error al conectar con Google Sheets, iniciando tour con diseño original:", err);
        originalTourConstructor.call(self, settings, devicesUrl);
    });
};

// Mantenemos los prototipos heredados intactos para que el reproductor no rompa sus funciones
TDV.Tour.prototype = originalTourConstructor.prototype;
Object.assign(TDV.Tour, originalTourConstructor);
</script>

<script>
console.log("%c=== INICIANDO ESCANEO DE ALTA PRECISIÓN ===", "color: #00ffff; font-weight: bold; font-size: 14px;");

function escudriñarMemoria(objeto, rutaActual = "window", visitados = new Set()) {
    if (!objeto || visitados.has(objeto) || typeof objeto !== "object") return;
    visitados.add(objeto);
    
    for (let propiedad in objeto) {
        try {
            let valor = objeto[propiedad];
            let nuevaRuta = Array.isArray(objeto) ? `${rutaActual}[${propiedad}]` : `${rutaActual}.${propiedad}`;
            
            // Si encontramos el ID de tu lote, el sistema nos dirá dónde está metido
            if (valor === "lote_01") {
                console.log(`%c🎯 ¡ENCONTRADO! 'lote_01' existe en: ${nuevaRuta}`, "color: #00ff00; font-weight: bold; font-size: 13px;");
                console.log("📦 Objeto contenedor completo para análisis de color:", objeto);
            }
            
            if (typeof valor === "object" && valor !== null) {
                escudriñarMemoria(valor, nuevaRuta, visitados);
            }
        } catch (e) {
            // Ignorar errores de seguridad del navegador
        }
    }
}

// Esperamos 6 segundos a que el recorrido virtual de 3DVista se monte por completo en pantalla
setTimeout(() => {
    console.log("🔎 Buscando la ubicación secreta de tus lotes en la memoria de 3DVista v2024...");
    escudriñarMemoria(window);
    console.log("🏁 Escaneo profundo terminado.");
}, 6000);
</script>

<script>
console.log("%c=== INICIANDO ESPIONAJE TÉCNICO TRACCO ===", "color: #00ff00; font-weight: bold; font-size: 14px;");

const URL_GOOGLE_SHEETS = "https://docs.google.com/spreadsheets/d/1Iffh-VbZUFFYpI5sVI8HQAz6IPgACs_W2sq0iEH4iVo/export?format=csv";

// 1. Verificar si el Excel responde bien
fetch(URL_GOOGLE_SHEETS)
.then(r => r.text())
.then(data => {
    console.log("🟢 1. EXCEL CONECTADO. Filas detectadas:", data.split("\n").length);
})
.catch(e => console.error("🔴 ERROR CONEXIÓN EXCEL:", e));

// 2. Rastrear objetos de 3DVista en memoria
let checadorSistemas = setInterval(() => {
    console.log("🔍 Buscando contenedores de 3DVista...");
    
    if (window.tdvData) {
        console.log("🟢 2. DETECTADO window.tdvData");
        if (window.tdvData.panoramas && window.tdvData.panoramas[0]) {
            let primerPano = window.tdvData.panoramas[0];
            console.log("📦 Datos del primer Panorama:", primerPano);
            if (primerPano.hotspots) {
                console.log("🔥 ¡Hotspots encontrados en tdvData! Cantidad:", primerPano.hotspots.length);
                console.log("📐 Estructura real del primer Hotspot:", JSON.stringify(primerPano.hotspots[0]));
            } else {
                console.log("⚠️ El panorama no reporta hotspots en tdvData.");
            }
        }
    } else {
        console.log("❌ window.tdvData aún no existe en el mapa global.");
    }

    if (window.pano) {
        console.log("🟢 3. DETECTADO window.pano (Visor en vivo)");
        if (typeof window.pano.getPanoramas === "function") {
            let p = window.pano.getPanoramas();
            console.log("📱 Panoramas en vivo activos:", p);
        }
        clearInterval(checadorSistemas); // Paramos al encontrar el visor
    }
}, 1000);

// Detener el ciclo si pasa mucho tiempo
setTimeout(() => clearInterval(checadorSistemas), 10000);
</script>
